<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Котел Гарант</title>
</head>
<body>
<p id="msg" style="font-family:sans-serif;text-align:center;margin-top:40vh;color:#666">Загрузка…</p>
<script>
(async function() {
  try {
    const files = ["s0.b64","s1.b64","s2.b64","s3.b64"];
    const parts = await Promise.all(files.map(f => fetch(f+"?v=4").then(r => r.text())));
    const b64 = parts.join("").replace(/\s/g,"");
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const text = await new Response(stream).text();
    document.open(); document.write(text); document.close();
  } catch (e) {
    document.getElementById("msg").textContent = "Обновите страницу (Chrome/Safari).";
    console.error(e);
  }
})();
</script>
</body>
</html>
